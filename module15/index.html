<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<h1>Static position</h1>

<div id="static">

    This div has a static position
</div>

<h1>relative position</h1>
<div id="relative">

    This div has a relative position
</div>

<h1 id="h1fixed">Fixed position</h1>
<div id="fixed">

    This div has a Fixed position
</div>

<h1>Absolute position</h1>
<div id="parent">
<div id="absolute"></div>
    This div has a absolute position
</div>

<h1>Sticky position</h1>
<div id="sticky"> This div has a sticky position</div>

</body>
</html>
